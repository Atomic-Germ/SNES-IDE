name: Linux (Build and Test)

# Trigger the workflow on pushes and pull-requests to the default branch
on:
  push:
    branches: [ linux/** ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  linux-build:
    name: Build (Green-Light)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build
        run: |
          python3 build/build.py linux

      - name: Verify
        run: |
          if [ ! -d "SNES-IDE-out" ]; then
            echo "Build artifact not found!"
            exit 1
          fi

      - name: Compress
        run: |
          cd "${{ github.workspace }}"
          zip -r sneside-linux.zip SNES-IDE-out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sneside-linux
          path: sneside-linux.zip
          retention-days: 7

  linux-tests-greenlight:
    name: Tests (Green-Light)
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sneside-linux

      - name: Extract sneside-linux.zip
        run: |
          unzip sneside-linux.zip

      - name: Check expected libs folders
        run: |
          set -e
          expected_libs=(
            "bsnes"
            "font"
            "include"
            "libs"
            "M8TE"
            "notepad++"
            "pvsneslib/devkitsnes"
            "pvsneslib/lib"
            "pvsneslib/tools"
            "template"
          )
          missing_libs=()
          for lib in "${expected_libs[@]}"; do
            if [ ! -d "SNES-IDE-out/libs/$lib" ]; then
              echo "Missing: $lib"
              missing_libs+=("$lib")
            fi
          done
          if [ ${#missing_libs[@]} -gt 0 ]; then
            echo "Missing expected lib files: ${missing_libs[*]}"
            exit 1
          else
            echo "All expected lib files found."
          fi

      - name: Check expected tools files
        run: |
          set -e
          expected_files=(
            "INSTALL.bat"
            "snes-ide.py"
            "tools/audio-tools.py"
            "tools/create-new-project.py"
            "tools/externTools.py"
            "tools/gfx-tools.py"
            "tools/automatizer-batch.sh"
            "install.sh"
          )
          missing_files=()
          for file in "${expected_files[@]}"; do
            if [ ! -f "SNES-IDE-out/$file" ]; then
              echo "Missing: $file"
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "Missing expected files: ${missing_files[*]}"
            exit 1
          else
            echo "All expected files found."
          fi

      - name: Check file permissions
        run: |
          set -e
          # Check that Python files are executable
          executable_files=(
            "snes-ide.py"
            "tools/audio-tools.py"
            "tools/create-new-project.py"
            "tools/externTools.py"
            "tools/gfx-tools.py"
            "tools/automatizer-batch.sh"
            "install.sh"
          )
          for file in "${executable_files[@]}"; do
            if [ ! -x "SNES-IDE-out/$file" ]; then
              echo "File not executable: $file"
              exit 1
            fi
          done
          echo "All expected files are executable."

      - name: Test installer script
        run: |
          set -e
          # Basic syntax check of installer script
          if [ ! -f "SNES-IDE-out/install.sh" ]; then
            echo "Installer script not found"
            exit 1
          fi
          # Check if script starts with shebang
          if ! head -1 SNES-IDE-out/install.sh | grep -q "^#!/"; then
            echo "Installer script missing shebang"
            exit 1
          fi
          echo "Installer script looks valid."
