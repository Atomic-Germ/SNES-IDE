<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Installer Textual Layout Preview</title>
    <link rel="stylesheet" href="tui_textual_preview.css">
</head>
<body>
    <header>Header</header>
    <div class="body">
        <div class="left">
            <h3>Categories</h3>
            <ul>
                <li>Category 1</li>
                <li>Category 2</li>
            </ul>
        </div>
        <div class="center">
            <h3>Tools</h3>
            <ul>
                <li>Tool 1</li>
                <li>Tool 2</li>
            </ul>
            <div class="details">Tool details here</div>
        </div>
    </div>
    <div class="buttons">
        <button>INSTALL</button>
        <button>CANCEL</button>
        <button>SETTINGS</button>
        <button>QUIT</button>
    </div>
    <div id="progress_bar">Progress: [████████░░░░] 50%</div>
    <div id="log_box">Log messages here...</div>
    <div id="status_bar">Status info</div>
    <footer>Footer</footer>
</body>
</html>
